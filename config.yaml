paths:
  input_mp3: input/input.mp3
  input_video: ""
  background_mp3: input/background.mp3
  outputs_dir: outputs
  asr_srt: outputs/asr/zh_raw.srt
  asr_words: outputs/asr/zh_raw.words.json
  merged_asr_srt: outputs/merged/zh_asr_merged.srt
  cleaned_srt: outputs/cleaned/zh_cleaned.srt
  corrected_srt: outputs/critic/zh_corrected.srt
  translated_srt: outputs/translated/en_translated.srt
  final_srt: outputs/final/en_final.srt
  tts_segments_dir: outputs/tts_segments
  reports_dir: outputs/reports
  audio_dir: outputs/audio
  narration_wav: outputs/audio/narration_en.wav
  narration_mp3: outputs/audio/narration_en.mp3

server:
  host: 127.0.0.1
  port: 8000

jobs:
  root_dir: outputs/jobs

ffmpeg:
  ffmpeg_path: ffmpeg/bin/ffmpeg.exe
  ffprobe_path: ffmpeg/bin/ffprobe.exe

media:
  audio_sample_rate: 16000

separation:
  provider: demucs
  method: python
  model: htdemucs
  device: cpu
  shifts: 0
  overlap: 0.1
  segment: 7.5

video:
  copy_video: true

tos:
  endpoint: ""
  region: ""
  bucket: ""
  access_key_id_env: DOUBAO_TOS_ACCESS_KEY_ID
  secret_access_key_env: DOUBAO_TOS_SECRET_ACCESS_KEY
  presign_expires: 3600
  object_prefix: movie-dub/asr

workflow:
  allow_mock_asr_for_jobs: false
  # Job ASR strategy is selected by video_type.
  # movie_commentary: doubao_file with a single default speaker_0.
  # manju: doubao_file with enable_speaker_info.
  movie_commentary_asr_provider: doubao_file
  movie_commentary_default_speaker_id: speaker_0
  manju_asr_provider: doubao_file

asr:
  provider: mock
  language: ""
  mock_when_missing_input: true
  api_key_env: DOUBAO_ASR_API_KEY
  resource_id: volc.seedasr.auc
  submit_url: https://openspeech.bytedance.com/api/v3/auc/bigmodel/submit
  query_url: https://openspeech.bytedance.com/api/v3/auc/bigmodel/query
  uid: movie_dub_workflow
  audio_format: wav
  http_timeout: 30
  poll_interval: 2.0
  max_query_attempts: 300
  doubao_model_name: bigmodel
  enable_itn: true
  enable_punc: false
  enable_ddc: false
  show_utterances: true
  enable_speaker_info: false
  srt_emit_speaker: true       # SRT 文件是否输出 [speaker_1] 前缀
  word_cue_max_duration_ms: 6000  # 词级切短句:单条最大时长(ms)
  word_cue_max_chars: 30          # 词级切短句:单条最大字数

llm:
  api_key_env: LLM_API_KEY
  base_url_env: LLM_BASE_URL
  model_env: LLM_MODEL
  timeout_env: LLM_TIMEOUT
  max_retries_env: LLM_MAX_RETRIES
  base_url: https://api.openai.com/v1
  model: mock
  timeout: 60
  max_retries: 2

translation:
  allow_mock_fallback: false
  chunk_size: 20
  max_parallel_chunks: 3
  chunk_max_retries: 3

srt:
  merge_max_chars: 38
  merge_max_gap_ms: 450
  merge_max_duration_ms: 6500

tts:
  provider: doubao
  voice: zh_female_popo_mars_bigtts
  rate: "+40%"
  sample_rate: 24000
  words_per_minute: 155
  max_retries: 3
  concurrency: 25
  pause_before_tts: true
  speaker_profiles: {}
  doubao:
    api_key_env: DOUBAO_TTS_API_KEY
    endpoint: https://openspeech.bytedance.com/api/v3/tts/unidirectional
    resource_id: seed-tts-2.0
    model_env: TTS_MODEL
    model: seed-tts-2.0-standard
    default_voice_id: zh_female_popo_mars_bigtts
    format: mp3
    sample_rate: 24000
    bit_rate: 128000
    timeout: 60
    enable_subtitle: false
    require_usage_tokens: false
    explicit_language: ""
    explicit_dialect: ""
    silence_duration: 0
    disable_markdown_filter: false
    disable_emoji_filter: false
    aigc_watermark: false
  minimax:
    api_key_env: LLM_API_KEY
    group_id_env: MINIMAX_GROUP_ID
    base_url_env: ""
    model_env: TTS_MODEL
    base_url: https://token.cxtfun.com
    model: ""
    default_voice_id: ""
    create_path: /v1/minimax/tts/async
    query_path: /v1/minimax/tts/tasks/{task_id}
    file_path: ""
    format: mp3
    timeout: 60
    task_timeout: 600
    poll_interval: 1.5
    bitrate: 128000
    channel: 2
    language_boost: auto

duration:
  max_overrun_ms: 350
  max_ratio: 1.12
  max_reflection_rounds: 1

audio:
  mix_background: false
  background_volume: 0.18

alignment:
  mode: simple
  max_shift_back_overlap_ms: 200
  shift_back_gap_ms: 50
  enable_overlap_resolution: true
  max_shift_forward_ms: 1000

trace:
  enabled: false          # 工作流运行时是否采集 LLM 调用 trace(仅 LLM 真实启用时生效)
  cases_dir: eval/cases   # 产出的 case 数据目录,可直接被 eval 框架加载
